name: DC-03 matcher audit

on:
  push:
    branches:
      - stage/dc-03-conference-engine
    paths:
      - .github/workflows/dc-03-match-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-03-conference-engine
          fetch-depth: 0

      - name: Audit exact and regex matches
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          landing = Path('components/landing.tsx').read_text(encoding='utf-8-sig')
          events = Path('data/events.ts').read_text(encoding='utf-8-sig')

          exact = {
            'events_type_copy': (events, '  formatLabel: string;\n  assets: {'),
            'events_archive_copy': (events, '  formatLabel: "Формат участия",\n  assets: {'),
            'events_location_type': (events, '  location: {\n    verified: boolean;\n    venue: string;\n    address: string;\n    note: string;'),
            'events_location_data': (events, '  location: {\n    verified: false,\n    venue: "Площадка архивного события",\n    address: "Адрес скрыт до верификации",\n    note: "Маршрут архивного события скрыт до подтверждения корректных данных.",'),
            'landing_import': (landing, 'import { eventData, type AudienceItem, type ProgramItem, type Speaker } from "@/data/events";'),
            'hero_signature': (landing, 'function HeroVisual() {'),
            'hero_asset': (landing, '        src="/hero-stage-3.png"'),
            'speaker_asset': (landing, '  const speakerImageSrc = `/speaker-${index + 1}-face.png`;'),
            'map_signature': (landing, 'function MapCardExact() {'),
            'map_asset': (landing, '<Image src="/location-map.png" alt="" fill className="object-cover object-center" />'),
            'ticket_signature': (landing, 'function RegistrationTicket() {'),
            'closed_signature': (landing, 'function ClosedEventCard() {'),
            'closed_label': (landing, '<p className="text-sm uppercase tracking-[0.18em] text-violet-200/80">Архив события</p>'),
            'closed_title': (landing, '<h3 className="mt-5 font-display text-5xl leading-[0.95] text-white">Продажи завершены</h3>'),
            'partner_signature': (landing, 'function PartnerVisualExact() {'),
            'partner_asset': (landing, '      style={{ backgroundImage: "url(\'/partner-handshake.png\')" }}'),
            'sticky_call': (landing, '<StickyCTA />'),
            'hero_call': (landing, '            <HeroVisual />'),
            'format_copy': (landing, '                  copy="для предпринимателей и инвесторов"'),
            'program_lead': (landing, '              Один день полезного контента, нетворкинга и практических инсайтов от экспертов.'),
            'program_details': (landing, '              Основная часть проходит с 12:00 до 17:00. После — ужин со спикерами в отдельном формате.'),
            'program_accent': (landing, '                    accent={item.time === "15:30" ? "featured" : item.time === "17:00" ? "final" : undefined}'),
            'registration_title': (landing, '                title={registrationOpen ? "Забронируйте место на конференции" : "Архив конференции"}'),
            'registration_form': (landing, '<RegistrationForm />'),
            'ticket_call': (landing, '{registrationOpen ? <RegistrationTicket /> : <ClosedEventCard />}'),
            'registration_note': (landing, '{registrationOpen ? eventData.registration.note : "Продажи и прием новых заявок на это событие отключены."}'),
            'partner_route': (landing, '<Link href="#footer-contacts" className="btn-primary inline-flex w-fit">'),
            'partner_visual_call': (landing, '<PartnerVisualExact />'),
            'venue_description': (landing, '                  Современная площадка в центре города с удобной транспортной доступностью и комфортной инфраструктурой.'),
            'map_call': (landing, '<MapCardExact />'),
            'unverified_title': (landing, '<p className="text-lg font-semibold text-white">Площадка архивного события на проверке</p>'),
          }

          regex = {
            'closed_copy': r'<p className="mt-5 max-w-md text-base leading-7 text-white/68">\s*Июньская конференция закрыта для регистрации\. Следующая дата и условия участия будут\s*опубликованы отдельным событием после подтверждения площадки и программы\.\s*</p>',
            'registration_description': r'description=\{\s*registrationOpen\s*\? eventData\.registration\.lead\s*:\s*"Регистрация на июньское событие завершена\. Новая дата будет опубликована отдельной страницей после подтверждения площадки\."\s*\}',
            'location_description': r'description=\{\s*locationVerified\s*\? "Конференция пройдет в центре Екатеринбурга\."\s*:\s*"Архивные сведения о площадке временно скрыты до верификации адреса\."\s*\}',
            'unverified_copy': r'<p className="mx-auto mt-3 max-w-2xl text-sm leading-7 text-white/65">\s*В предыдущей версии сайта название бизнес-центра и адрес противоречили друг другу\.\s*Маршрут и адрес скрыты, чтобы не направлять посетителей в неверную локацию\. Для\s*следующей конференции адрес будет опубликован только после подтверждения площадки\.\s*</p>',
          }

          state_old = '''const footerCtaTitleParts = eventData.footer.ctaTitle.match(/^(.*конференции)\\s+(«.*»)$/);\nconst lifecycle = getEventLifecycleBySlug(eventData.slug);\nconst registrationOpen = Boolean(lifecycle?.registrationOpen && lifecycle.status === "sales");\nconst locationVerified = false;\nconst legalReady = isLegalConfigReady();\nconst activeSocials = eventData.socials.filter((social) => social.href && social.href !== "#");\n\nexport function LandingPage() {'''

          lines = ['# DC-03 Matcher Audit', '', '## Exact matches', '```text']
          for label, (source, needle) in exact.items():
              lines.append(f'{label}={source.count(needle)}')
          lines.append(f'landing_state_block={landing.count(state_old)}')
          lines += ['```', '', '## Regex matches', '```text']
          for label, pattern in regex.items():
              lines.append(f'{label}={len(re.findall(pattern, landing, flags=re.S))}')
          lines += ['```', '']
          Path('docs/DC-03-MATCH-AUDIT.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DC-03-MATCH-AUDIT.md
          git commit -m 'docs: record DC-03 matcher audit'
          git push origin HEAD:stage/dc-03-conference-engine
