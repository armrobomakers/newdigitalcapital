name: DC-01 dependency gate

on:
  push:
    branches:
      - stage/dc-01-prelaunch-hardening
    paths:
      - .github/workflows/dc-01-dependency-gate.yml

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          ref: stage/dc-01-prelaunch-hardening
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Update patched Next.js dependencies
        run: |
          npm install --save-exact next@16.2.12
          npm install --save-dev --save-exact eslint-config-next@16.2.12

      - name: Verify clean install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit regenerated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files already up to date."
            exit 0
          fi
          git commit -m "security: update Next.js to 16.2.12"
          git push origin HEAD:stage/dc-01-prelaunch-hardening
