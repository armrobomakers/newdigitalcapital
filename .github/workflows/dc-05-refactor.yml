name: DC-05 targeted landing refactor

on:
  push:
    branches: [stage/dc-05-performance-accessibility]
    paths: [.github/workflows/dc-05-refactor.yml]
  pull_request:
    branches: [stage/dc-04-launch-infrastructure-security]
    paths: [.github/workflows/dc-05-refactor.yml]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-05-performance-accessibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply exact landing replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path('components/landing.tsx')
          text = path.read_text(encoding='utf-8-sig')

          replacements = [
              (
                  '''        fill\n        priority\n        className="object-cover object-center"\n''',
                  '''        fill\n        priority\n        sizes="(min-width: 1024px) 46vw, 100vw"\n        className="object-cover object-center"\n''',
                  'hero sizes',
              ),
              (
                  '''            fill\n            unoptimized\n            className="object-cover"\n''',
                  '''            fill\n            sizes="(min-width: 1024px) 270px, (min-width: 640px) 45vw, 90vw"\n            className="object-cover"\n''',
                  'speaker optimization',
              ),
              (
                  '''      <Image src={eventData.assets.mapImage} alt="" fill className="object-cover object-center" />\n''',
                  '''      <Image\n        src={eventData.assets.mapImage}\n        alt=""\n        fill\n        sizes="(min-width: 1024px) 52vw, 100vw"\n        className="object-cover object-center"\n      />\n''',
                  'map sizes',
              ),
              (
                  '''function PartnerVisualExact({ eventData }: { eventData: EventData }) {\n  return (\n    <div\n      className="relative min-h-[260px] overflow-hidden rounded-[32px] border border-white/10 bg-[#07061a] bg-cover bg-center shadow-soft"\n      style={{ backgroundImage: `url('${eventData.assets.partnerImage}')` }}\n    >\n      <div className="absolute inset-0 bg-[linear-gradient(90deg,rgba(4,3,13,0.14)_0%,rgba(4,3,13,0.04)_40%,rgba(4,3,13,0.18)_100%)]" />\n    </div>\n  );\n}\n''',
                  '''function PartnerVisualExact({ eventData }: { eventData: EventData }) {\n  return (\n    <div className="relative min-h-[260px] overflow-hidden rounded-[32px] border border-white/10 bg-[#07061a] shadow-soft">\n      <Image\n        src={eventData.assets.partnerImage}\n        alt=""\n        fill\n        sizes="(min-width: 1024px) 50vw, 100vw"\n        className="object-cover object-center"\n      />\n      <div className="absolute inset-0 bg-[linear-gradient(90deg,rgba(4,3,13,0.14)_0%,rgba(4,3,13,0.04)_40%,rgba(4,3,13,0.18)_100%)]" />\n    </div>\n  );\n}\n''',
                  'partner optimized image',
              ),
              (
                  '''    <main className="relative pb-24 md:pb-0">\n      <StickyCTA eventData={eventData} />\n\n      <section className="section-shell pt-1 md:pt-3">\n''',
                  '''    <main id="main-content" className="relative pb-24 md:pb-0">\n      <Link\n        href="#content-start"\n        className="fixed left-4 top-4 z-[100] -translate-y-24 rounded-full bg-white px-4 py-2 text-sm font-semibold text-black transition focus:translate-y-0 focus:outline-none focus:ring-2 focus:ring-violet-300"\n      >\n        Перейти к содержанию\n      </Link>\n      <StickyCTA eventData={eventData} />\n\n      <section id="content-start" className="section-shell pt-1 md:pt-3">\n''',
                  'skip link',
              ),
              (
                  '''            <Link href="#top" className="inline-flex items-center gap-3">\n''',
                  '''            <Link\n              href="#top"\n              aria-label="Цифровой капитал — начало страницы"\n              className="inline-flex items-center gap-3"\n            >\n''',
                  'logo label',
              ),
              (
                  '''            <nav className="hidden items-center gap-1 lg:flex">\n''',
                  '''            <nav aria-label="Основная навигация" className="hidden items-center gap-1 lg:flex">\n''',
                  'desktop nav label',
              ),
              (
                  '''            <Link\n              href={registrationOpen ? "#register" : "#program"}\n              className="btn-primary hidden md:inline-flex"\n            >\n''',
                  '''            <details className="relative lg:hidden">\n              <summary className="cursor-pointer list-none rounded-full border border-white/10 bg-white/[0.04] px-4 py-2 text-sm font-semibold text-white/90 outline-none transition hover:bg-white/[0.07] focus-visible:ring-2 focus-visible:ring-violet-200">\n                Меню\n              </summary>\n              <div className="absolute right-0 top-[calc(100%+0.75rem)] z-50 min-w-[230px] rounded-[22px] border border-white/10 bg-[#0a081b]/95 p-2 shadow-soft backdrop-blur-2xl">\n                <nav aria-label="Мобильная навигация" className="flex flex-col">\n                  {eventData.navItems.map((item) => (\n                    <Link\n                      key={item.href}\n                      href={item.href}\n                      className="rounded-[16px] px-4 py-3 text-sm text-white/78 transition hover:bg-white/[0.07] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-200"\n                    >\n                      {item.label}\n                    </Link>\n                  ))}\n                </nav>\n              </div>\n            </details>\n\n            <Link\n              href={registrationOpen ? "#register" : "#program"}\n              className="btn-primary hidden md:inline-flex"\n            >\n''',
                  'mobile menu',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Install and verify
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run typecheck
          npm run build
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/landing.tsx
          git commit -m "perf: optimize landing media and mobile navigation"
          git push origin HEAD:stage/dc-05-performance-accessibility
