name: DC-04 final quality gate

on:
  push:
    branches: [stage/dc-04-launch-infrastructure-security]
    paths: [.github/workflows/dc-04-quality.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:7485
      NEXT_PUBLIC_INDEXING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-04-launch-infrastructure-security
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: HTTP smoke
        run: |
          set -euo pipefail
          npm run start >/tmp/dc04-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          BASE=http://127.0.0.1:7485
          for i in $(seq 1 30); do curl -fsS "$BASE/api/health" >/tmp/health.json && break; sleep 1; done
          grep -q '"conference_catalog_ready":true' /tmp/health.json
          grep -q '"sales_event_structured_data_ready":false' /tmp/health.json
          grep -q '"ready_for_paid_traffic":false' /tmp/health.json
          curl -fsS -D /tmp/headers.txt "$BASE/ekb" -o /tmp/ekb.html
          grep -qi '^content-security-policy-report-only:' /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt
          if grep -qi '^x-powered-by:' /tmp/headers.txt; then exit 1; fi
          grep -q 'name="twitter:card" content="summary_large_image"' /tmp/ekb.html
          if grep -q 'application/ld+json' /tmp/ekb.html; then exit 1; fi
          test "$(curl -sS -o /tmp/manifest.json -w '%{http_code}' "$BASE/manifest.webmanifest")" = "200"
          grep -q 'Цифровой капитал' /tmp/manifest.json
      - name: Record result
        run: |
          mkdir -p docs
          printf '# DC-04 Quality Gate Result\n\n- Tested commit: `%s`\n- npm ci: **success**\n- production audit: **success**\n- full audit: **success**\n- lint: **success**\n- typecheck: **success**\n- build: **success**\n- HTTP security/SEO smoke: **success**\n- Next: `16.3.2`\n- CSP mode: **Report-Only**\n' "$(git rev-parse HEAD)" > docs/DC-04-QUALITY-RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DC-04-QUALITY-RESULT.md
          git commit -m "ci: record DC-04 quality result"
          git push origin HEAD:stage/dc-04-launch-infrastructure-security
