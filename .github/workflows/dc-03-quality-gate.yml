name: DC-03 quality gate

on:
  push:
    branches:
      - stage/dc-03-conference-engine
    paths:
      - .github/workflows/dc-03-quality-gate.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:7485
      NEXT_PUBLIC_INDEXING_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage/dc-03-conference-engine
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Clean install
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/dc03-install.log

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/dc03-lint.log

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/dc03-typecheck.log

      - name: Build
        id: build
        if: steps.install.outcome == 'success' && steps.lint.outcome == 'success' && steps.typecheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/dc03-build.log

      - name: HTTP smoke
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/dc03-smoke.log) 2>&1
          npm run start >/tmp/dc03-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          BASE_URL="http://127.0.0.1:7485"

          for attempt in $(seq 1 30); do
            if curl -fsS "$BASE_URL/api/health" >/tmp/health.json; then
              break
            fi
            sleep 1
          done

          echo "health=$(cat /tmp/health.json)"
          grep -q '"conference_catalog_ready":true' /tmp/health.json
          grep -q '"status":"gated"' /tmp/health.json
          grep -q '"id":"ekb-2026-06-13"' /tmp/health.json
          grep -q '"slug":"ekb"' /tmp/health.json

          test "$(curl -sS -o /tmp/ekb.html -w '%{http_code}' "$BASE_URL/ekb")" = "200"
          grep -q '13 июня 2026' /tmp/ekb.html

          ROOT_HEADERS=$(curl -sS -D - -o /dev/null "$BASE_URL/")
          echo "$ROOT_HEADERS"
          echo "$ROOT_HEADERS" | grep -Eq '^HTTP/.* 30[78]'
          echo "$ROOT_HEADERS" | grep -qi '^location: /ekb'

          test "$(curl -sS -o /tmp/unknown.html -w '%{http_code}' "$BASE_URL/not-a-conference")" = "404"
          test "$(curl -sS -o /tmp/apply.html -w '%{http_code}' "$BASE_URL/apply/partner/ekb")" = "200"
          grep -q '13 июня 2026' /tmp/apply.html
          test "$(curl -sS -o /tmp/apply-unknown.html -w '%{http_code}' "$BASE_URL/apply/partner/not-a-conference")" = "404"

          test "$(curl -sS -o /tmp/robots.txt -w '%{http_code}' "$BASE_URL/robots.txt")" = "200"
          grep -qi 'disallow' /tmp/robots.txt
          test "$(curl -sS -o /tmp/sitemap.xml -w '%{http_code}' "$BASE_URL/sitemap.xml")" = "200"

          ANALYTICS_STATUS=$(curl -sS -o /tmp/analytics.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/analytics" \
            -H 'Content-Type: application/json' \
            --data '{"event_name":"page_view","event_id":"ekb-2026-06-13","session_id":"dc03-smoke","path":"/ekb"}')
          echo "analytics=$ANALYTICS_STATUS $(cat /tmp/analytics.json)"
          test "$ANALYTICS_STATUS" = "202"
          grep -q '"accepted":true' /tmp/analytics.json

          REGISTER_STATUS=$(curl -sS -o /tmp/register.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/register" \
            -H 'Content-Type: application/json' \
            --data '{"event_id":"ekb-2026-06-13","lead_type":"attendee","name":"DC03 Smoke","phone":"+79990000000","privacy_consent":true}')
          echo "register=$REGISTER_STATUS $(cat /tmp/register.json)"
          test "$REGISTER_STATUS" = "409"
          grep -q '"error":"registration_closed"' /tmp/register.json

      - name: Write result
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          mkdir -p docs
          TESTED_SHA="$(git rev-parse HEAD)"
          {
            echo "# DC-03 Quality Gate Result"
            echo
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- Node: \`$(node -v)\`"
            echo "- npm: \`$(npm -v)\`"
            echo "- npm ci: **$INSTALL_OUTCOME**"
            echo "- lint: **$LINT_OUTCOME**"
            echo "- typecheck: **$TYPECHECK_OUTCOME**"
            echo "- build: **$BUILD_OUTCOME**"
            echo "- HTTP smoke: **$SMOKE_OUTCOME**"
            echo
            echo "## Scope"
            echo "Conference catalog integrity, dynamic event routing, primary-event redirect, application routing, health readiness, analytics and archive registration gates."
            for pair in "install:$INSTALL_OUTCOME:/tmp/dc03-install.log" "lint:$LINT_OUTCOME:/tmp/dc03-lint.log" "typecheck:$TYPECHECK_OUTCOME:/tmp/dc03-typecheck.log" "build:$BUILD_OUTCOME:/tmp/dc03-build.log" "smoke:$SMOKE_OUTCOME:/tmp/dc03-smoke.log"; do
              IFS=: read -r label outcome logfile <<< "$pair"
              if [ "$outcome" != "success" ] && [ -f "$logfile" ]; then
                echo
                echo "## $label diagnostics"
                echo '```text'
                tail -n 180 "$logfile"
                if [ "$label" = "smoke" ] && [ -f /tmp/dc03-server.log ]; then
                  echo
                  echo "--- server log ---"
                  tail -n 120 /tmp/dc03-server.log
                fi
                echo '```'
              fi
            done
          } > docs/DC-03-QUALITY-RESULT.md

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DC-03-QUALITY-RESULT.md
          git commit -m "ci: record DC-03 quality result" || exit 0
          git push origin HEAD:stage/dc-03-conference-engine

      - name: Enforce gate
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          test "$INSTALL_OUTCOME" = "success"
          test "$LINT_OUTCOME" = "success"
          test "$TYPECHECK_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
          test "$SMOKE_OUTCOME" = "success"
