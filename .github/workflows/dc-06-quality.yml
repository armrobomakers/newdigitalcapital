name: DC-06 launch ops gate

on:
  push:
    branches: [stage/dc-06-launch-ops]
    paths: [.github/workflows/dc-06-quality.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:7485
      NEXT_PUBLIC_INDEXING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-06-launch-ops
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Health readiness smoke
        run: |
          set -euo pipefail
          npm run start >/tmp/dc06-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          BASE=http://127.0.0.1:7485
          for i in $(seq 1 30); do
            if curl -fsS "$BASE/api/health" >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"status":"gated"' /tmp/health.json
          grep -q '"ready_for_registration":false' /tmp/health.json
          grep -q '"ready_for_paid_traffic":false' /tmp/health.json
          grep -q '"code":"sales_event_missing"' /tmp/health.json
          grep -q '"code":"legal_config_incomplete"' /tmp/health.json
          grep -q '"code":"lead_storage_unavailable"' /tmp/health.json
          grep -q '"code":"analytics_unavailable"' /tmp/health.json
          grep -q '"code":"branded_domain_missing"' /tmp/health.json
          grep -q '"code":"indexing_disabled"' /tmp/health.json
          grep -q '"active_sales_event":null' /tmp/health.json
          grep -q '"location_verified":false' /tmp/health.json
          grep -q '"contacts_ready":false' /tmp/health.json
          if grep -q 'LEAD_STORAGE_WEBHOOK_URL' /tmp/health.json; then exit 1; fi
          if grep -q 'ANALYTICS_WEBHOOK_URL' /tmp/health.json; then exit 1; fi
      - name: Record result
        run: |
          mkdir -p docs
          printf '# DC-06 Quality Gate Result\n\n- Tested commit: `%s`\n- npm ci/audit: **success**\n- lint: **success**\n- typecheck: **success**\n- build: **success**\n- health blocker smoke: **success**\n- secret-name leakage check: **success**\n- current archive status: **correctly gated**\n' "$(git rev-parse HEAD)" > docs/DC-06-QUALITY-RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DC-06-QUALITY-RESULT.md
          git commit -m "ci: record DC-06 quality result"
          git push origin HEAD:stage/dc-06-launch-ops
