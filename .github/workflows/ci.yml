name: Digital Capital CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digital-capital-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:7485
  NEXT_PUBLIC_INDEXING_ENABLED: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Strict install and audits
        run: |
          set -euo pipefail
          npm ci
          npm approve-scripts --allow-scripts-pending | tee /tmp/pending-scripts.txt
          grep -q 'No packages with unreviewed install scripts' /tmp/pending-scripts.txt
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Lint, typecheck and production build
        run: npm run check

      - name: Event lifecycle activation matrix
        run: |
          set -euo pipefail
          rm -rf /tmp/dc13-lifecycle
          npx tsc data/event-registry.ts \
            --target ES2022 \
            --module commonjs \
            --moduleResolution node \
            --skipLibCheck \
            --outDir /tmp/dc13-lifecycle
          node scripts/verify-event-lifecycle.cjs /tmp/dc13-lifecycle/event-registry.js

      - name: Launch readiness contract matrix
        run: |
          set -euo pipefail
          rm -rf /tmp/dc12-readiness
          npx tsc lib/launch-readiness-core.ts \
            --target ES2022 \
            --module commonjs \
            --moduleResolution node \
            --skipLibCheck \
            --outDir /tmp/dc12-readiness
          node scripts/verify-launch-readiness-core.cjs /tmp/dc12-readiness/launch-readiness-core.js

      - name: Event activation CLI contract
        run: |
          set -euo pipefail
          npm run event:check -- tests/fixtures/event-activation.ready.json paid-traffic >/tmp/activation-ready.json
          grep -q '"registration_ready": true' /tmp/activation-ready.json
          grep -q '"paid_traffic_ready": true' /tmp/activation-ready.json

          if npm run event:check -- tests/fixtures/event-activation.blocked.json registration >/tmp/activation-blocked.json 2>&1; then
            echo "blocked activation fixture unexpectedly passed"
            exit 1
          fi
          grep -q '"registration_ready": false' /tmp/activation-blocked.json
          grep -q '"venue_unverified"' /tmp/activation-blocked.json
          grep -q '"legal_config_incomplete"' /tmp/activation-blocked.json

          if npm run event:check -- config/event-activation.template.json config >/tmp/activation-template.json 2>&1; then
            echo "template activation manifest unexpectedly passed"
            exit 1
          fi
          grep -q 'activation_manifest_is_template' /tmp/activation-template.json

      - name: Release regression invariants
        run: node scripts/verify-release-invariants.mjs

      - name: Runtime and security smoke
        run: |
          set -euo pipefail
          npm run start >/tmp/digital-capital-server.log 2>&1 &
          PID=$!
          trap 'STATUS=$?; if [ "$STATUS" -ne 0 ]; then echo "--- server log ---"; cat /tmp/digital-capital-server.log || true; fi; kill "$PID" 2>/dev/null || true' EXIT

          BASE=http://127.0.0.1:7485
          READY=0
          for i in $(seq 1 40); do
            if curl -fsS "$BASE/api/health" >/tmp/health.json 2>/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = "1"

          CURL='curl --retry 3 --retry-connrefused --retry-delay 1 -sS'

          test "$($CURL -o /tmp/ekb.html -w '%{http_code}' "$BASE/ekb")" = "200"
          grep -q '13 июня 2026' /tmp/ekb.html
          ! grep -q '6 900 ₽' /tmp/ekb.html
          ! grep -q 'Малышева 51' /tmp/ekb.html
          ! grep -q 'БЦ Саммит' /tmp/ekb.html
          ! grep -q 'application/ld+json' /tmp/ekb.html

          test "$($CURL -o /tmp/september.html -w '%{http_code}' "$BASE/ekb-2026-09-26")" = "200"
          grep -q '26 сентября 2026' /tmp/september.html
          grep -q 'БЦ «Саммит»' /tmp/september.html
          grep -q '1 000 ₽' /tmp/september.html
          grep -q '3 000 ₽' /tmp/september.html
          grep -q '5 000 ₽' /tmp/september.html
          grep -q 'data-registration-state="closed"' /tmp/september.html
          ! grep -q 'data-registration-state="open"' /tmp/september.html
          ! grep -q 'application/ld+json' /tmp/september.html

          ROOT_STATUS=$($CURL -o /tmp/root.html -w '%{http_code}' -L "$BASE/")
          test "$ROOT_STATUS" = "200"
          grep -q '26 сентября 2026' /tmp/root.html

          test "$($CURL -o /tmp/privacy.html -w '%{http_code}' "$BASE/legal/privacy")" = "200"
          test "$($CURL -o /tmp/offer.html -w '%{http_code}' "$BASE/legal/offer")" = "200"
          test "$($CURL -o /tmp/robots.txt -w '%{http_code}' "$BASE/robots.txt")" = "200"
          grep -qi 'Disallow: /' /tmp/robots.txt
          test "$($CURL -o /tmp/sitemap.xml -w '%{http_code}' "$BASE/sitemap.xml")" = "200"

          grep -q '"status":"gated"' /tmp/health.json
          grep -q '"ready_for_registration":false' /tmp/health.json
          grep -q '"active_sales_event"' /tmp/health.json
          grep -q '"id":"ekb-2026-09-26"' /tmp/health.json
          grep -q '"event_email_missing"' /tmp/health.json
          grep -q '"event_phone_missing"' /tmp/health.json
          grep -q '"legal_config_incomplete"' /tmp/health.json
          grep -q '"lead_storage_unavailable"' /tmp/health.json
          ! grep -q '"sales_event_missing"' /tmp/health.json

          ANALYTICS_ORIGIN_STATUS=$($CURL -o /tmp/analytics-origin.json -w '%{http_code}' \
            -H 'Origin: https://evil.example' \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "$BASE/api/analytics")
          test "$ANALYTICS_ORIGIN_STATUS" = "403"
          grep -q '"error":"origin_not_allowed"' /tmp/analytics-origin.json

          ANALYTICS_TYPE_STATUS=$($CURL -o /tmp/analytics-type.json -w '%{http_code}' \
            -H 'Content-Type: text/plain' \
            --data-binary '{}' \
            "$BASE/api/analytics")
          test "$ANALYTICS_TYPE_STATUS" = "415"
          grep -q '"error":"unsupported_content_type"' /tmp/analytics-type.json

          head -c 9000 /dev/zero | tr '\0' 'a' >/tmp/analytics-padding.txt
          { printf '{"padding":"'; cat /tmp/analytics-padding.txt; printf '"}'; } >/tmp/analytics-large.json
          ANALYTICS_LARGE_STATUS=$(curl -sS \
            -o /tmp/analytics-large-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Transfer-Encoding: chunked' \
            --data-binary @/tmp/analytics-large.json \
            "$BASE/api/analytics")
          test "$ANALYTICS_LARGE_STATUS" = "413"
          grep -q '"error":"payload_too_large"' /tmp/analytics-large-response.json

          ANALYTICS_INVALID_STATUS=$($CURL -o /tmp/analytics-invalid.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary '{bad-json' \
            "$BASE/api/analytics")
          test "$ANALYTICS_INVALID_STATUS" = "400"
          grep -q '"error":"invalid_json"' /tmp/analytics-invalid.json

          ANALYTICS_STATUS=$($CURL -D /tmp/analytics-headers.txt -o /tmp/analytics.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"event_name":"page_view","event_id":"ekb-2026-06-13","session_id":"123e4567-e89b-12d3-a456-426614174000","path":"/ekb","occurred_at":"not-a-date","properties":{"source":"ci","count":1}}' \
            "$BASE/api/analytics")
          test "$ANALYTICS_STATUS" = "202"
          grep -q '"accepted":true' /tmp/analytics.json
          grep -q '"forwarded":false' /tmp/analytics.json
          grep -qi '^cache-control: no-store' /tmp/analytics-headers.txt

          ORIGIN_STATUS=$($CURL -o /tmp/register-origin.json -w '%{http_code}' \
            -H 'Origin: https://evil.example' \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "$BASE/api/register")
          test "$ORIGIN_STATUS" = "403"
          grep -q '"error":"origin_not_allowed"' /tmp/register-origin.json

          TYPE_STATUS=$($CURL -o /tmp/register-type.json -w '%{http_code}' \
            -H 'Content-Type: text/plain' \
            --data-binary 'not-json' \
            "$BASE/api/register")
          test "$TYPE_STATUS" = "415"
          grep -q '"error":"unsupported_content_type"' /tmp/register-type.json

          head -c 17000 /dev/zero | tr '\0' 'a' >/tmp/register-padding.txt
          { printf '{"padding":"'; cat /tmp/register-padding.txt; printf '"}'; } >/tmp/register-large.json
          LARGE_STATUS=$(curl -sS \
            -o /tmp/register-large-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Transfer-Encoding: chunked' \
            --data-binary @/tmp/register-large.json \
            "$BASE/api/register")
          test "$LARGE_STATUS" = "413"
          grep -q '"error":"payload_too_large"' /tmp/register-large-response.json

          RSTATUS=$($CURL -o /tmp/register.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: 123e4567-e89b-12d3-a456-426614174000' \
            -d '{"event_id":"ekb-2026-06-13","lead_type":"attendee","name":"CI Test","phone":"+79990000000","privacy_consent":true}' \
            "$BASE/api/register")
          test "$RSTATUS" = "409"
          grep -q '"error":"registration_closed"' /tmp/register.json

          INVALID_TICKET_STATUS=$($CURL -o /tmp/register-invalid-ticket.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'X-Real-IP: 203.0.113.20' \
            -d '{"event_id":"ekb-2026-09-26","lead_type":"attendee","ticket":"made-up-tier","name":"Ticket Test","phone":"+79990000002","privacy_consent":true}' \
            "$BASE/api/register")
          test "$INVALID_TICKET_STATUS" = "400"
          grep -q '"error":"invalid_ticket"' /tmp/register-invalid-ticket.json

          OPEN_UI_FAIL_CLOSED_STATUS=$($CURL -o /tmp/register-open-gated.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'X-Real-IP: 203.0.113.21' \
            -d '{"event_id":"ekb-2026-09-26","lead_type":"attendee","ticket":"standard-1000","name":"Open Test","phone":"+79990000003","privacy_consent":true}' \
            "$BASE/api/register")
          test "$OPEN_UI_FAIL_CLOSED_STATUS" = "503"
          grep -q '"error":"legal_configuration_incomplete"' /tmp/register-open-gated.json

          for i in 1 2 3 4 5; do
            STATUS=$($CURL -o /tmp/register-rate-$i.json -w '%{http_code}' \
              -H 'X-Real-IP: 203.0.113.10' \
              -H 'Content-Type: application/json' \
              -d '{"event_id":"ekb-2026-06-13","lead_type":"attendee","name":"Rate Test","phone":"+79990000001","privacy_consent":true}' \
              "$BASE/api/register")
            test "$STATUS" = "409"
          done

          # 429 is the expected response here. Do not use curl --retry: curl honors Retry-After
          # and would intentionally sleep for the full rate-limit window before retrying.
          RATE_STATUS=$(curl -sS -D /tmp/register-rate-headers.txt -o /tmp/register-rate.json -w '%{http_code}' \
            -H 'X-Real-IP: 203.0.113.10' \
            -H 'Content-Type: application/json' \
            -d '{"event_id":"ekb-2026-06-13","lead_type":"attendee","name":"Rate Test","phone":"+79990000001","privacy_consent":true}' \
            "$BASE/api/register")
          test "$RATE_STATUS" = "429"
          grep -q '"error":"rate_limited"' /tmp/register-rate.json
          grep -qi '^retry-after: ' /tmp/register-rate-headers.txt

          $CURL -I "$BASE/ekb-2026-09-26" >/tmp/headers.txt
          grep -qi '^content-security-policy-report-only:' /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt
          if grep -qi '^x-powered-by:' /tmp/headers.txt; then
            exit 1
          fi

      - name: Container runtime smoke
        run: |
          set -euo pipefail
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL=http://127.0.0.1:7485 \
            --build-arg NEXT_PUBLIC_INDEXING_ENABLED=false \
            -t digitalcapital:ci .

          test "$(docker inspect digitalcapital:ci --format '{{.Config.User}}')" = "node"
          docker run --rm --entrypoint node digitalcapital:ci --version | grep -Eq '^v24\.'
          docker run --rm --entrypoint npm digitalcapital:ci --version | grep -Eq '^11\.17\.0$'

          docker run -d --name digitalcapital-ci -p 7486:7485 digitalcapital:ci >/tmp/digitalcapital-container-id.txt
          trap 'STATUS=$?; if [ "$STATUS" -ne 0 ]; then echo "--- container log ---"; docker logs digitalcapital-ci || true; fi; docker rm -f digitalcapital-ci >/dev/null 2>&1 || true' EXIT

          BASE=http://127.0.0.1:7486
          READY=0
          for i in $(seq 1 40); do
            if curl -fsS "$BASE/api/health" >/tmp/container-health.json 2>/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = "1"
          grep -q '"status":"gated"' /tmp/container-health.json
          grep -q '"id":"ekb-2026-09-26"' /tmp/container-health.json

          test "$(curl -sS -o /tmp/container-ekb.html -w '%{http_code}' "$BASE/ekb")" = "200"
          grep -q '13 июня 2026' /tmp/container-ekb.html
          ! grep -q 'application/ld+json' /tmp/container-ekb.html

          test "$(curl -sS -o /tmp/container-september.html -w '%{http_code}' "$BASE/ekb-2026-09-26")" = "200"
          grep -q '26 сентября 2026' /tmp/container-september.html
          grep -q '1 000 ₽' /tmp/container-september.html
          ! grep -q 'application/ld+json' /tmp/container-september.html
