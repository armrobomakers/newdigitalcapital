name: Digital Capital Visual Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digital-capital-visual-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:7485
  NEXT_PUBLIC_INDEXING_ENABLED: "false"
  VISUAL_REVIEW_ENABLED: "true"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install project
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0-chromium

      - name: Install screenshot browser
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture responsive visual review
        run: |
          set -euo pipefail
          mkdir -p visual-review

          npm run start >/tmp/digital-capital-visual-server.log 2>&1 &
          PID=$!
          trap 'STATUS=$?; if [ "$STATUS" -ne 0 ]; then echo "--- visual server log ---"; cat /tmp/digital-capital-visual-server.log || true; fi; kill "$PID" 2>/dev/null || true' EXIT

          BASE=http://127.0.0.1:7485
          READY=0
          for i in $(seq 1 40); do
            if curl -fsS "$BASE/ekb-2026-09-26" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = "1"

          test "$(curl -sS -o /tmp/visual-gallery.html -w '%{http_code}' "$BASE/internal/visual-review")" = "200"
          grep -q 'CI visual review' /tmp/visual-gallery.html
          grep -q 'TODO_ORGANIZER_PHONE' /tmp/visual-gallery.html

          PW='npx --yes playwright@1.55.0 screenshot --browser chromium --full-page --wait-for-timeout 1400'

          $PW --viewport-size "1440,1000" \
            "$BASE/ekb-2026-09-26" \
            visual-review/landing-desktop.png

          $PW --viewport-size "1024,900" \
            "$BASE/ekb-2026-09-26" \
            visual-review/landing-tablet.png

          $PW --viewport-size "390,844" \
            "$BASE/ekb-2026-09-26" \
            visual-review/landing-mobile.png

          $PW --viewport-size "1440,1000" \
            "$BASE/internal/visual-review" \
            visual-review/ui-gallery-desktop.png

          $PW --viewport-size "390,844" \
            "$BASE/internal/visual-review" \
            visual-review/ui-gallery-mobile.png

          cp /tmp/digital-capital-visual-server.log visual-review/server.log
          {
            echo "commit=${GITHUB_SHA}"
            echo "event=/ekb-2026-09-26"
            echo "gallery=/internal/visual-review"
            echo "playwright=1.55.0"
            echo "viewports=1440x1000,1024x900,390x844"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sha256sum visual-review/*.png
          } > visual-review/manifest.txt

      - name: Upload visual review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-capital-visual-review-${{ github.sha }}
          path: visual-review/
          if-no-files-found: error
          retention-days: 14
