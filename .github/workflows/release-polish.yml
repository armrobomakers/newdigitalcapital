name: Release archive polish

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/release-polish.yml]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/archive-platform-2026-08-23
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply exact archive copy cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/events.ts')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '    ticketTitle: "Стандартный билет",\n    price: "6 900 ₽",': '    ticketTitle: "Архив события",\n    price: "",',
            '    benefits: [\n      "Живой формат",\n      "Доступ ко всем выступлениям",\n      "Материалы мероприятия",\n      "Нетворкинг с участниками",\n      "Сертификат участника",\n    ],': '    benefits: [],',
            '        "Архивная информация о площадке временно скрыта: в предыдущей версии сайта название бизнес-центра и адрес противоречили друг другу. Для следующего события адрес будет опубликован только после верификации.",': '        "Площадка архивного события сейчас не указана. Для следующего события адрес будет опубликован только после подтверждения площадки и схемы прохода.",',
            '    ctaTitle: "Присоединяйтесь к конференции «Цифровой капитал»",': '    ctaTitle: "Следите за следующей конференцией «Цифровой капитал»",',
          }
          for old, new in replacements.items():
            if s.count(old) != 1:
              raise SystemExit(f'exact replacement mismatch: {old[:80]!r}; count={s.count(old)}')
            s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify code after polish
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.ts
          git commit -m "content: polish safe archive copy"
          git push origin HEAD:release/archive-platform-2026-08-23
