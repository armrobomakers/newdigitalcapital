name: DC-03 inspect single-event coupling

on:
  push:
    branches:
      - stage/dc-03-conference-engine
    paths:
      - .github/workflows/dc-03-inspect.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-03-conference-engine
          fetch-depth: 0

      - name: Build occurrence report
        run: |
          mkdir -p docs
          {
            echo '# DC-03 single-event coupling report'
            echo
            echo '## components/landing.tsx'
            echo '```text'
            grep -n 'eventData' components/landing.tsx || true
            echo '```'
            echo
            echo '## components/sticky-cta.tsx'
            echo '```text'
            grep -n 'eventData' components/sticky-cta.tsx || true
            echo '```'
            echo
            echo '## app and data references'
            echo '```text'
            grep -RIn --exclude-dir=.next --exclude-dir=node_modules --exclude='landing.tsx' --exclude='sticky-cta.tsx' 'eventData' app data components lib || true
            echo '```'
            echo
            echo '## file sizes'
            echo '```text'
            wc -l components/landing.tsx data/events.ts app/'[slug]'/page.tsx components/sticky-cta.tsx
            echo '```'
          } > docs/DC-03-OCCURRENCES.md

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DC-03-OCCURRENCES.md
          git commit -m 'docs: record DC-03 coupling map'
          git push origin HEAD:stage/dc-03-conference-engine
