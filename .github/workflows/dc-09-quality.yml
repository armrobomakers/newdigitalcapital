name: DC-09 temporal safety quality gate

on:
  push:
    branches: [stage/dc-09-temporal-safety]
    paths: [.github/workflows/dc-09-quality.yml]
  pull_request:
    branches: [stage/dc-08-supply-chain-reproducibility]
    paths: [.github/workflows/dc-09-quality.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:7485
      NEXT_PUBLIC_INDEXING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-09-temporal-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Strict install and audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Code quality
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Compile temporal engine
        run: |
          rm -rf /tmp/dc09
          npx tsc data/event-registry.ts \
            --target ES2022 \
            --module commonjs \
            --moduleResolution node \
            --skipLibCheck \
            --types node \
            --outDir /tmp/dc09

      - name: Temporal matrix
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const {
            evaluateLeadCaptureAvailability,
            getLeadCaptureAvailability,
          } = require('/tmp/dc09/event-registry.js');

          const base = {
            id: 'matrix-event',
            slug: 'matrix',
            status: 'sales',
            startsAt: '2026-09-10T18:00:00+05:00',
            pageReady: true,
            leadCapture: { attendee: true, partner: false, speaker: false, media: false },
          };

          function expect(reason, now, patch = {}) {
            const event = {
              ...base,
              ...patch,
              leadCapture: { ...base.leadCapture, ...(patch.leadCapture || {}) },
            };
            const actual = evaluateLeadCaptureAvailability(event, 'attendee', now);
            assert.equal(actual.reason, reason, `${now}: expected ${reason}, got ${actual.reason}`);
            assert.equal(actual.open, reason === 'open');
            return actual;
          }

          expect('open', '2026-09-10T10:00:00+05:00');
          expect('event_started', '2026-09-10T18:00:00+05:00');
          expect('event_started', '2026-09-10T19:00:00+05:00');
          expect('page_not_ready', '2026-09-10T10:00:00+05:00', { pageReady: false });
          expect('lead_type_disabled', '2026-09-10T10:00:00+05:00', { leadCapture: { attendee: false } });
          expect('status_closed', '2026-09-10T10:00:00+05:00', { status: 'scheduled' });
          expect('invalid_event_time', '2026-09-10T10:00:00+05:00', { startsAt: 'not-a-date' });
          expect('window_not_open', '2026-09-10T11:59:59+05:00', {
            leadCaptureWindows: { attendee: { opensAt: '2026-09-10T12:00:00+05:00', closesAt: '2026-09-10T17:00:00+05:00' } },
          });
          expect('open', '2026-09-10T12:00:00+05:00', {
            leadCaptureWindows: { attendee: { opensAt: '2026-09-10T12:00:00+05:00', closesAt: '2026-09-10T17:00:00+05:00' } },
          });
          expect('window_closed', '2026-09-10T17:00:00+05:00', {
            leadCaptureWindows: { attendee: { opensAt: '2026-09-10T12:00:00+05:00', closesAt: '2026-09-10T17:00:00+05:00' } },
          });
          expect('invalid_window', '2026-09-10T10:00:00+05:00', {
            leadCaptureWindows: { attendee: { opensAt: 'bad-date' } },
          });
          expect('invalid_window', '2026-09-10T10:00:00+05:00', {
            leadCaptureWindows: { attendee: { opensAt: '2026-09-10T17:00:00+05:00', closesAt: '2026-09-10T16:00:00+05:00' } },
          });

          const capped = expect('open', '2026-09-10T17:30:00+05:00', {
            leadCaptureWindows: { attendee: { closesAt: '2026-09-10T20:00:00+05:00' } },
          });
          assert.equal(capped.closesAt, '2026-09-10T13:00:00.000Z');

          const archived = getLeadCaptureAvailability('ekb-2026-06-13', 'attendee', '2026-08-23T12:00:00+05:00');
          assert.ok(archived);
          assert.equal(archived.open, false);
          assert.equal(archived.reason, 'lead_type_disabled');
          NODE

      - name: Runtime health and registration smoke
        run: |
          set -euo pipefail
          npm run start >/tmp/dc09-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          BASE=http://127.0.0.1:7485
          for i in $(seq 1 30); do
            if curl -fsS "$BASE/api/health" >/tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"status":"gated"' /tmp/health.json
          grep -q '"reason":"lead_type_disabled"' /tmp/health.json
          grep -q '"eventStartsAt":"2026-06-13T12:00:00+05:00"' /tmp/health.json

          STATUS=$(curl -sS -o /tmp/registration.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: 123e4567-e89b-12d3-a456-426614174000' \
            -d '{"event_id":"ekb-2026-06-13","lead_type":"attendee","name":"Test User","phone":"+79990000000","privacy_consent":true}' \
            "$BASE/api/register")
          test "$STATUS" = "409"
          grep -q '"error":"registration_closed"' /tmp/registration.json
          grep -q '"reason":"lead_type_disabled"' /tmp/registration.json

      - name: Summarize result
        run: |
          echo 'DC-09 temporal safety gate PASS'
          echo "Node $(node --version)"
          echo "npm $(npm --version)"
