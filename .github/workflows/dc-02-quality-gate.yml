# Final DC-02 gate with HTTP smoke tests.
name: DC-02 quality gate

on:
  push:
    branches:
      - stage/dc-02-conversion-foundation
    paths:
      - .github/workflows/dc-02-quality-gate.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage/dc-02-conversion-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Clean install
        id: install
        run: npm ci

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/dc02-lint.log

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/dc02-typecheck.log

      - name: Build
        id: build
        if: steps.install.outcome == 'success' && steps.lint.outcome == 'success' && steps.typecheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/dc02-build.log

      - name: HTTP smoke tests
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/dc02-smoke.log) 2>&1
          npm run start >/tmp/dc02-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          BASE_URL="http://127.0.0.1:7485"

          for attempt in $(seq 1 30); do
            if curl -fsS "$BASE_URL/api/health" >/tmp/health.json; then
              break
            fi
            sleep 1
          done

          echo "health=$(cat /tmp/health.json)"
          grep -q '"status":"gated"' /tmp/health.json
          grep -q '"ready_for_registration":false' /tmp/health.json

          test "$(curl -sS -o /tmp/ekb.html -w '%{http_code}' "$BASE_URL/ekb")" = "200"
          test "$(curl -sS -o /tmp/privacy.html -w '%{http_code}' "$BASE_URL/legal/privacy")" = "200"
          test "$(curl -sS -o /tmp/offer.html -w '%{http_code}' "$BASE_URL/legal/offer")" = "200"
          test "$(curl -sS -o /tmp/thanks.html -w '%{http_code}' "$BASE_URL/thanks")" = "200"
          test "$(curl -sS -o /tmp/robots.txt -w '%{http_code}' "$BASE_URL/robots.txt")" = "200"
          test "$(curl -sS -o /tmp/sitemap.xml -w '%{http_code}' "$BASE_URL/sitemap.xml")" = "200"
          grep -qi 'disallow' /tmp/robots.txt

          ANALYTICS_STATUS=$(curl -sS -o /tmp/analytics.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/analytics" \
            -H 'Content-Type: application/json' \
            --data '{"event_name":"page_view","event_id":"ekb-2026-06-13","session_id":"smoke-session","path":"/ekb","properties":{"utm_source":"smoke"}}')
          echo "analytics_status=$ANALYTICS_STATUS body=$(cat /tmp/analytics.json)"
          test "$ANALYTICS_STATUS" = "202"
          grep -q '"accepted":true' /tmp/analytics.json
          grep -q '"forwarded":false' /tmp/analytics.json

          REGISTER_STATUS=$(curl -sS -o /tmp/register.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/register" \
            -H 'Content-Type: application/json' \
            --data '{"event_id":"ekb-2026-06-13","lead_type":"attendee","name":"Smoke Test","phone":"+79990000000","privacy_consent":true}')
          echo "register_status=$REGISTER_STATUS body=$(cat /tmp/register.json)"
          test "$REGISTER_STATUS" = "409"
          grep -q '"error":"registration_closed"' /tmp/register.json

          ROOT_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL/")
          echo "root_status=$ROOT_STATUS"
          test "$ROOT_STATUS" = "307" -o "$ROOT_STATUS" = "308"

      - name: Write quality report
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          mkdir -p docs
          TESTED_SHA="$(git rev-parse HEAD)"
          {
            echo "# DC-02 Quality Gate Result"
            echo
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- Node: \`$(node -v)\`"
            echo "- npm: \`$(npm -v)\`"
            echo "- npm ci: **$INSTALL_OUTCOME**"
            echo "- lint: **$LINT_OUTCOME**"
            echo "- typecheck: **$TYPECHECK_OUTCOME**"
            echo "- build: **$BUILD_OUTCOME**"
            echo "- HTTP smoke: **$SMOKE_OUTCOME**"
            if [ "$LINT_OUTCOME" != "success" ] && [ -f /tmp/dc02-lint.log ]; then
              echo
              echo "## Lint diagnostics"
              echo '```text'
              tail -n 120 /tmp/dc02-lint.log
              echo '```'
            fi
            if [ "$TYPECHECK_OUTCOME" != "success" ] && [ -f /tmp/dc02-typecheck.log ]; then
              echo
              echo "## Typecheck diagnostics"
              echo '```text'
              tail -n 160 /tmp/dc02-typecheck.log
              echo '```'
            fi
            if [ "$BUILD_OUTCOME" == "failure" ] && [ -f /tmp/dc02-build.log ]; then
              echo
              echo "## Build diagnostics"
              echo '```text'
              tail -n 160 /tmp/dc02-build.log
              echo '```'
            fi
            if [ "$SMOKE_OUTCOME" != "success" ] && [ -f /tmp/dc02-smoke.log ]; then
              echo
              echo "## HTTP smoke diagnostics"
              echo '```text'
              tail -n 160 /tmp/dc02-smoke.log
              if [ -f /tmp/dc02-server.log ]; then
                echo
                echo "--- server log ---"
                tail -n 120 /tmp/dc02-server.log
              fi
              echo '```'
            fi
          } > docs/DC-02-QUALITY-RESULT.md

      - name: Commit quality report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DC-02-QUALITY-RESULT.md
          git commit -m "ci: record DC-02 quality result" || exit 0
          git push origin HEAD:stage/dc-02-conversion-foundation

      - name: Enforce gate
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          test "$INSTALL_OUTCOME" = "success"
          test "$LINT_OUTCOME" = "success"
          test "$TYPECHECK_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
          test "$SMOKE_OUTCOME" = "success"
