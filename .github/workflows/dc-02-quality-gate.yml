name: DC-02 quality gate

on:
  push:
    branches:
      - stage/dc-02-conversion-foundation
    paths:
      - .github/workflows/dc-02-quality-gate.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage/dc-02-conversion-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Clean install
        id: install
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Build
        id: build
        run: npm run build

      - name: Write quality report
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p docs
          TESTED_SHA="$(git rev-parse HEAD)"
          {
            echo "# DC-02 Quality Gate Result"
            echo
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- Node: \`$(node -v)\`"
            echo "- npm: \`$(npm -v)\`"
            echo "- npm ci: **$INSTALL_OUTCOME**"
            echo "- lint: **$LINT_OUTCOME**"
            echo "- typecheck: **$TYPECHECK_OUTCOME**"
            echo "- build: **$BUILD_OUTCOME**"
            echo
            echo "Generated by the temporary DC-02 GitHub-hosted quality gate."
          } > docs/DC-02-QUALITY-RESULT.md

      - name: Commit quality report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DC-02-QUALITY-RESULT.md
          git commit -m "ci: record DC-02 quality result" || exit 0
          git push origin HEAD:stage/dc-02-conversion-foundation
