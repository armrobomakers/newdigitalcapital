# Diagnostic DC-02 gate rerun after lifecycle type fixes.
name: DC-02 quality gate

on:
  push:
    branches:
      - stage/dc-02-conversion-foundation
    paths:
      - .github/workflows/dc-02-quality-gate.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage/dc-02-conversion-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Clean install
        id: install
        run: npm ci

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/dc02-lint.log

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/dc02-typecheck.log

      - name: Build
        id: build
        if: steps.install.outcome == 'success' && steps.lint.outcome == 'success' && steps.typecheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/dc02-build.log

      - name: Write quality report
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p docs
          TESTED_SHA="$(git rev-parse HEAD)"
          {
            echo "# DC-02 Quality Gate Result"
            echo
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- Node: \`$(node -v)\`"
            echo "- npm: \`$(npm -v)\`"
            echo "- npm ci: **$INSTALL_OUTCOME**"
            echo "- lint: **$LINT_OUTCOME**"
            echo "- typecheck: **$TYPECHECK_OUTCOME**"
            echo "- build: **$BUILD_OUTCOME**"
            if [ "$LINT_OUTCOME" != "success" ] && [ -f /tmp/dc02-lint.log ]; then
              echo
              echo "## Lint diagnostics"
              echo '```text'
              tail -n 120 /tmp/dc02-lint.log
              echo '```'
            fi
            if [ "$TYPECHECK_OUTCOME" != "success" ] && [ -f /tmp/dc02-typecheck.log ]; then
              echo
              echo "## Typecheck diagnostics"
              echo '```text'
              tail -n 160 /tmp/dc02-typecheck.log
              echo '```'
            fi
            if [ "$BUILD_OUTCOME" == "failure" ] && [ -f /tmp/dc02-build.log ]; then
              echo
              echo "## Build diagnostics"
              echo '```text'
              tail -n 160 /tmp/dc02-build.log
              echo '```'
            fi
          } > docs/DC-02-QUALITY-RESULT.md

      - name: Commit quality report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DC-02-QUALITY-RESULT.md
          git commit -m "ci: record DC-02 quality result" || exit 0
          git push origin HEAD:stage/dc-02-conversion-foundation

      - name: Enforce gate
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          test "$INSTALL_OUTCOME" = "success"
          test "$LINT_OUTCOME" = "success"
          test "$TYPECHECK_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
