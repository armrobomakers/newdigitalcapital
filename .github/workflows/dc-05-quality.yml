name: DC-05 quality gate

on:
  push:
    branches: [stage/dc-05-performance-accessibility]
    paths: [.github/workflows/dc-05-quality.yml]
  pull_request:
    branches: [stage/dc-04-launch-infrastructure-security]
    paths: [.github/workflows/dc-05-quality.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:7485
      NEXT_PUBLIC_INDEXING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-05-performance-accessibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Source invariants
        run: |
          set -euo pipefail
          ! grep -q 'unoptimized' components/landing.tsx
          grep -q 'sizes="(min-width: 1024px) 46vw, 100vw"' components/landing.tsx
          grep -q 'sizes="(min-width: 1024px) 270px' components/landing.tsx
          grep -q 'sizes="(min-width: 1024px) 52vw, 100vw"' components/landing.tsx
          grep -q 'sizes="(min-width: 1024px) 50vw, 100vw"' components/landing.tsx
          grep -q 'aria-label="Основная навигация"' components/landing.tsx
          grep -q 'aria-label="Мобильная навигация"' components/landing.tsx
          grep -q 'Перейти к содержанию' components/landing.tsx
          grep -q 'prefers-reduced-motion' app/globals.css
          grep -q 'focus-visible:ring-2' app/globals.css
      - name: Install and audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Code quality
        run: |
          npm run lint
          npm run typecheck
          npm run build
      - name: HTTP and rendered HTML smoke
        run: |
          set -euo pipefail
          npm run start >/tmp/dc05-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          BASE=http://127.0.0.1:7485
          for i in $(seq 1 30); do
            if curl -fsS "$BASE/ekb" >/tmp/ekb.html; then break; fi
            sleep 1
          done
          grep -q 'Перейти к содержанию' /tmp/ekb.html
          grep -q 'Основная навигация' /tmp/ekb.html
          grep -q 'Мобильная навигация' /tmp/ekb.html
          grep -q '>Меню<' /tmp/ekb.html
          grep -q '_next/image' /tmp/ekb.html
          grep -q 'speaker-1-face.png' /tmp/ekb.html
          curl -fsS -D /tmp/headers.txt -o /dev/null "$BASE/ekb"
          grep -qi '^content-security-policy-report-only:' /tmp/headers.txt
          if grep -qi '^x-powered-by:' /tmp/headers.txt; then exit 1; fi
      - name: Record result
        run: |
          mkdir -p docs
          printf '# DC-05 Quality Gate Result\n\n- Tested commit: `%s`\n- source invariants: **success**\n- npm ci/audit: **success**\n- lint: **success**\n- typecheck: **success**\n- build: **success**\n- HTTP/rendered HTML smoke: **success**\n- speaker images: **Next Image optimized**\n- partner visual: **Next Image optimized**\n- responsive image sizes: **enabled**\n- keyboard skip link: **enabled**\n- mobile navigation: **enabled**\n- reduced motion support: **enabled**\n' "$(git rev-parse HEAD)" > docs/DC-05-QUALITY-RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DC-05-QUALITY-RESULT.md
          git commit -m "ci: record DC-05 quality result"
          git push origin HEAD:stage/dc-05-performance-accessibility
