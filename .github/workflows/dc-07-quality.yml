name: DC-07 lead delivery quality gate

on:
  push:
    branches: [stage/dc-07-lead-delivery-reliability]
    paths: [.github/workflows/dc-07-quality.yml]
  pull_request:
    branches: [stage/dc-06-launch-ops]
    paths: [.github/workflows/dc-07-quality.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:7485
      NEXT_PUBLIC_INDEXING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-07-lead-delivery-reliability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install and audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Source invariants
        run: |
          set -euo pipefail
          grep -q '"Idempotency-Key": idempotencyKey' components/registration-form.tsx
          grep -q 'X-DigitalCapital-Signature' lib/lead-delivery.ts
          grep -q 'X-DigitalCapital-Timestamp' lib/lead-delivery.ts
          grep -q 'primary_storage_invalid_ack' lib/lead-delivery.ts
          grep -q 'MIN_LEAD_STORAGE_SECRET_LENGTH = 32' lib/lead-delivery.ts
          grep -q 'lead_storage_signature_missing' lib/launch-readiness.ts
          grep -q 'Персональные данные доступны только в основном хранилище заявок' app/api/register/route.ts
          ! grep -q 'Имя:' app/api/register/route.ts
          ! grep -q 'Телефон:' app/api/register/route.ts
          ! grep -q 'Email:' app/api/register/route.ts
          ! grep -q 'Компания:' app/api/register/route.ts

      - name: Code quality
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Compile delivery helper for contract test
        run: |
          rm -rf /tmp/dc07
          npx tsc lib/lead-delivery.ts \
            --target ES2022 \
            --module commonjs \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck \
            --types node \
            --outDir /tmp/dc07

      - name: HMAC, ACK and idempotency contract test
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const http = require('node:http');
          const { createHmac } = require('node:crypto');
          const {
            buildLeadEnvelope,
            deliverPrimaryLead,
            isValidIdempotencyKey,
            isValidLeadStorageSecret,
          } = require('/tmp/dc07/lead-delivery.js');

          (async () => {
            const secret = 'dc07-test-secret-0123456789-abcdef';
            const requestId = '123e4567-e89b-12d3-a456-426614174000';
            assert.equal(isValidIdempotencyKey(requestId), true);
            assert.equal(isValidIdempotencyKey('short'), false);
            assert.equal(isValidLeadStorageSecret(secret), true);
            assert.equal(isValidLeadStorageSecret('too-short'), false);

            let successfulCalls = 0;
            const server = http.createServer((req, res) => {
              const chunks = [];
              req.on('data', (chunk) => chunks.push(chunk));
              req.on('end', () => {
                try {
                  const body = Buffer.concat(chunks).toString('utf8');
                  const parsed = JSON.parse(body);
                  const timestamp = String(req.headers['x-digitalcapital-timestamp']);
                  const expectedSignature = 'sha256=' + createHmac('sha256', secret)
                    .update(`${timestamp}.${body}`, 'utf8')
                    .digest('hex');

                  assert.equal(req.method, 'POST');
                  assert.equal(req.headers['content-type'], 'application/json');
                  assert.equal(req.headers['idempotency-key'], requestId);
                  assert.equal(req.headers['x-digitalcapital-schema'], 'lead.v1');
                  assert.equal(req.headers['x-digitalcapital-request-id'], requestId);
                  assert.equal(req.headers['x-digitalcapital-signature'], expectedSignature);
                  assert.equal(parsed.schema_version, 'lead.v1');
                  assert.equal(parsed.request_id, requestId);
                  assert.equal(parsed.source, 'newdigitalcapital');

                  res.statusCode = 200;
                  res.setHeader('content-type', 'application/json');
                  if (req.url === '/bad-ack') {
                    res.end(JSON.stringify({ ok: true, request_id: 'wrong-request-id' }));
                    return;
                  }

                  successfulCalls += 1;
                  res.end(JSON.stringify({
                    ok: true,
                    request_id: requestId,
                    duplicate: successfulCalls > 1,
                  }));
                } catch (error) {
                  res.statusCode = 500;
                  res.end(String(error));
                }
              });
            });

            await new Promise((resolve) => server.listen(0, '127.0.0.1', resolve));
            const address = server.address();
            assert.ok(address && typeof address === 'object');
            const base = `http://127.0.0.1:${address.port}`;
            const envelope = buildLeadEnvelope(
              { event_id: 'test-event', lead_type: 'attendee', name: 'Contract Test' },
              requestId,
              '2026-08-23T00:00:00.000Z'
            );

            const first = await deliverPrimaryLead({ url: `${base}/lead`, secret, envelope });
            assert.equal(first.request_id, requestId);
            assert.notEqual(first.duplicate, true);

            const retry = await deliverPrimaryLead({ url: `${base}/lead`, secret, envelope });
            assert.equal(retry.request_id, requestId);
            assert.equal(retry.duplicate, true);

            await assert.rejects(
              () => deliverPrimaryLead({ url: `${base}/bad-ack`, secret, envelope }),
              /primary_storage_invalid_ack/
            );

            await new Promise((resolve) => server.close(resolve));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Runtime health and archived registration smoke
        run: |
          set -euo pipefail
          LEAD_STORAGE_WEBHOOK_URL=http://127.0.0.1:9999 \
          LEAD_STORAGE_WEBHOOK_SECRET=short \
          npm run start >/tmp/dc07-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          BASE=http://127.0.0.1:7485
          for i in $(seq 1 30); do
            if curl -fsS "$BASE/api/health" >/tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"code":"lead_storage_signature_missing"' /tmp/health.json
          if grep -q 'LEAD_STORAGE_WEBHOOK_SECRET' /tmp/health.json; then exit 1; fi

          STATUS=$(curl -sS -o /tmp/registration.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: 123e4567-e89b-12d3-a456-426614174000' \
            -d '{"event_id":"ekb-2026-06-13","lead_type":"attendee","name":"Test User","phone":"+79990000000","privacy_consent":true}' \
            "$BASE/api/register")
          test "$STATUS" = "409"
          grep -q '"error":"registration_closed"' /tmp/registration.json

      - name: Record result
        run: |
          mkdir -p docs
          printf '# DC-07 Quality Gate Result\n\n- Tested commit: `%s`\n- npm ci/audit: **success**\n- lint: **success**\n- typecheck: **success**\n- build: **success**\n- HMAC verification: **success**\n- stable idempotency contract: **success**\n- duplicate ACK handling: **success**\n- mismatched ACK fails closed: **success**\n- health signature gate: **success**\n- Telegram PII source check: **success**\n- archived registration remains closed: **success**\n' "$(git rev-parse HEAD)" > docs/DC-07-QUALITY-RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DC-07-QUALITY-RESULT.md
          git commit -m "ci: record DC-07 quality result"
          git push origin HEAD:stage/dc-07-lead-delivery-reliability
