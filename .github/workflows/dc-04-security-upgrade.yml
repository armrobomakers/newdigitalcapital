# Rerun from the current branch head; no concurrent branch writes until the bot commit lands.
name: DC-04 security remediation

on:
  push:
    branches:
      - stage/dc-04-launch-infrastructure-security
    paths:
      - .github/workflows/dc-04-security-upgrade.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-04-launch-infrastructure-security
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Baseline install
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/install.txt
      - name: Upgrade runtime dependency
        id: upgrade_runtime
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm install --save-exact next@16.3.2 2>&1 | tee /tmp/upgrade-runtime.txt
      - name: Upgrade build dependencies
        id: upgrade_dev
        if: steps.upgrade_runtime.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm install --save-dev --save-exact eslint-config-next@16.3.2 postcss@8.5.26 2>&1 | tee /tmp/upgrade-dev.txt
      - name: Apply non-breaking audit fixes
        id: audit_fix
        if: steps.upgrade_dev.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm audit fix 2>&1 | tee /tmp/audit-fix.txt
      - name: Verify dependency groups
        id: groups
        if: steps.audit_fix.outcome == 'success'
        continue-on-error: true
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          if (pkg.dependencies?.next !== '16.3.2') throw new Error('next_not_runtime_16_3_2');
          if (pkg.dependencies?.postcss || pkg.dependencies?.['eslint-config-next']) throw new Error('build_dependency_moved_to_runtime');
          if (pkg.devDependencies?.postcss !== '8.5.26') throw new Error('postcss_not_dev_8_5_26');
          if (pkg.devDependencies?.['eslint-config-next'] !== '16.3.2') throw new Error('eslint_config_next_not_dev_16_3_2');
          NODE
      - name: Verify production audit
        id: audit_prod
        if: steps.groups.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/audit-prod.txt
      - name: Verify full audit
        id: audit_all
        if: steps.groups.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee /tmp/audit-all.txt
      - name: Lint
        id: lint
        if: steps.groups.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint.txt
      - name: Typecheck
        id: typecheck
        if: steps.groups.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.txt
      - name: Build
        id: build
        if: steps.lint.outcome == 'success' && steps.typecheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.txt
      - name: Write remediation report
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          UPGRADE_RUNTIME: ${{ steps.upgrade_runtime.outcome }}
          UPGRADE_DEV: ${{ steps.upgrade_dev.outcome }}
          AUDIT_FIX: ${{ steps.audit_fix.outcome }}
          GROUPS: ${{ steps.groups.outcome }}
          PROD_AUDIT: ${{ steps.audit_prod.outcome }}
          FULL_AUDIT: ${{ steps.audit_all.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          mkdir -p docs
          {
            echo "# DC-04 Security Remediation Result"
            echo
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- npm ci: **$INSTALL**"
            echo "- runtime upgrade: **$UPGRADE_RUNTIME**"
            echo "- dev upgrade: **$UPGRADE_DEV**"
            echo "- npm audit fix: **$AUDIT_FIX**"
            echo "- dependency groups: **$GROUPS**"
            echo "- production audit: **$PROD_AUDIT**"
            echo "- full audit: **$FULL_AUDIT**"
            echo "- lint: **$LINT**"
            echo "- typecheck: **$TYPECHECK**"
            echo "- build: **$BUILD**"
            if [ -f node_modules/next/package.json ]; then echo "- next: \`$(node -p \"require('./node_modules/next/package.json').version\")\`"; fi
            if [ -f node_modules/postcss/package.json ]; then echo "- postcss: \`$(node -p \"require('./node_modules/postcss/package.json').version\")\`"; fi
            for pair in \
              "install:$INSTALL:/tmp/install.txt" \
              "runtime-upgrade:$UPGRADE_RUNTIME:/tmp/upgrade-runtime.txt" \
              "dev-upgrade:$UPGRADE_DEV:/tmp/upgrade-dev.txt" \
              "audit-fix:$AUDIT_FIX:/tmp/audit-fix.txt" \
              "production-audit:$PROD_AUDIT:/tmp/audit-prod.txt" \
              "full-audit:$FULL_AUDIT:/tmp/audit-all.txt" \
              "lint:$LINT:/tmp/lint.txt" \
              "typecheck:$TYPECHECK:/tmp/typecheck.txt" \
              "build:$BUILD:/tmp/build.txt"; do
              IFS=: read -r label outcome logfile <<< "$pair"
              if [ "$outcome" != "success" ] && [ -f "$logfile" ]; then
                echo
                echo "## $label diagnostics"
                echo '```text'
                tail -n 180 "$logfile"
                echo '```'
              fi
            done
          } > docs/DC-04-SECURITY-RESULT.md
      - name: Commit remediation
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json docs/DC-04-SECURITY-RESULT.md
          git commit -m "security: remediate dependency advisories" || exit 0
          git push origin HEAD:stage/dc-04-launch-infrastructure-security
      - name: Enforce remediation
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          UPGRADE_RUNTIME: ${{ steps.upgrade_runtime.outcome }}
          UPGRADE_DEV: ${{ steps.upgrade_dev.outcome }}
          AUDIT_FIX: ${{ steps.audit_fix.outcome }}
          GROUPS: ${{ steps.groups.outcome }}
          PROD_AUDIT: ${{ steps.audit_prod.outcome }}
          FULL_AUDIT: ${{ steps.audit_all.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          test "$INSTALL" = "success"
          test "$UPGRADE_RUNTIME" = "success"
          test "$UPGRADE_DEV" = "success"
          test "$AUDIT_FIX" = "success"
          test "$GROUPS" = "success"
          test "$PROD_AUDIT" = "success"
          test "$FULL_AUDIT" = "success"
          test "$LINT" = "success"
          test "$TYPECHECK" = "success"
          test "$BUILD" = "success"
