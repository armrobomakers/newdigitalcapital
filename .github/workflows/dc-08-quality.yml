name: DC-08 supply-chain quality gate

on:
  push:
    branches: [stage/dc-08-supply-chain-reproducibility]
    paths: [.github/workflows/dc-08-quality.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-08-supply-chain-reproducibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify declared policy
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.engines?.node !== '24.x') throw new Error('node engine is not pinned to 24.x');
          if (pkg.engines?.npm !== '>=11.17.0 <12') throw new Error('npm engine range is unexpected');
          if (pkg.devEngines?.runtime?.name !== 'node' || pkg.devEngines.runtime.onFail !== 'error') throw new Error('runtime devEngine is not strict');
          if (pkg.devEngines?.packageManager?.name !== 'npm' || pkg.devEngines.packageManager.onFail !== 'error') throw new Error('package manager devEngine is not strict');
          const allowed = pkg.allowScripts || {};
          const keys = Object.keys(allowed);
          if (keys.length !== 1 || keys[0] !== 'unrs-resolver@1.12.2' || allowed[keys[0]] !== true) {
            throw new Error(`unexpected allowScripts policy: ${JSON.stringify(allowed)}`);
          }
          if (fs.readFileSync('.node-version', 'utf8').trim() !== '24') throw new Error('.node-version mismatch');
          const npmrc = fs.readFileSync('.npmrc', 'utf8');
          if (!/^engine-strict=true$/m.test(npmrc)) throw new Error('engine-strict is not enabled');
          if (!/^strict-allow-scripts=true$/m.test(npmrc)) throw new Error('strict-allow-scripts is not enabled');
          NODE

      - name: Strict install
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci 2>&1 | tee /tmp/npm-ci.txt
          if grep -q 'install scripts not yet covered by allowScripts' /tmp/npm-ci.txt; then
            echo 'npm ci still reports unreviewed install scripts'
            exit 1
          fi

      - name: No pending install-script approvals
        run: |
          set -euo pipefail
          npm approve-scripts --allow-scripts-pending 2>&1 | tee /tmp/pending.txt
          if grep -Eq 'package(s)? ha(s|ve) install scripts not yet covered by allowScripts|unrs-resolver@1\.12\.2.*postinstall' /tmp/pending.txt; then
            cat /tmp/pending.txt
            exit 1
          fi

      - name: Audit and build
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run build

      - name: Negative enforcement test
        run: |
          set -euo pipefail
          rm -rf /tmp/dc08-negative
          mkdir -p /tmp/dc08-negative
          cp package.json package-lock.json .npmrc /tmp/dc08-negative/
          cd /tmp/dc08-negative
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.allowScripts;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          set +e
          npm ci > /tmp/dc08-negative.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/dc08-negative.log
          if [ "$STATUS" -eq 0 ]; then
            echo 'strict install unexpectedly succeeded without allowScripts'
            exit 1
          fi
          grep -q 'unrs-resolver@1.12.2' /tmp/dc08-negative.log

      - name: Record result
        run: |
          NODE_VERSION=$(node --version)
          NPM_VERSION=$(npm --version)
          mkdir -p docs
          printf '# DC-08 Quality Gate Result\n\n- Tested commit: `%s`\n- Node: `%s`\n- npm: `%s`\n- toolchain policy: **success**\n- strict npm ci: **success**\n- pending install scripts: **none**\n- exact-version allowScripts policy: **success**\n- negative enforcement test without approval: **success**\n- production audit: **success**\n- full audit: **success**\n- lint: **success**\n- typecheck: **success**\n- build: **success**\n' "$(git rev-parse HEAD)" "$NODE_VERSION" "$NPM_VERSION" > docs/DC-08-QUALITY-RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DC-08-QUALITY-RESULT.md
          git commit -m "ci: record DC-08 quality result"
          git push origin HEAD:stage/dc-08-supply-chain-reproducibility
