name: DC-08 supply-chain quality gate

on:
  push:
    branches: [stage/dc-08-supply-chain-reproducibility]
    paths: [.github/workflows/dc-08-quality.yml]
  pull_request:
    branches: [stage/dc-07-lead-delivery-reliability]
    paths: [.github/workflows/dc-08-quality.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-08-supply-chain-reproducibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify declared policy
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.engines?.node !== '24.x') throw new Error('node engine is not pinned to 24.x');
          if (pkg.engines?.npm !== '>=11.17.0 <12') throw new Error('npm engine range is unexpected');
          if (pkg.devEngines?.runtime?.name !== 'node' || pkg.devEngines.runtime.onFail !== 'error') throw new Error('runtime devEngine is not strict');
          if (pkg.devEngines?.packageManager?.name !== 'npm' || pkg.devEngines.packageManager.onFail !== 'error') throw new Error('package manager devEngine is not strict');
          const policy = pkg.allowScripts || {};
          const keys = Object.keys(policy).sort();
          if (keys.length !== 2 || keys[0] !== 'fsevents' || keys[1] !== 'unrs-resolver@1.12.2') {
            throw new Error(`unexpected allowScripts keys: ${JSON.stringify(keys)}`);
          }
          if (policy['unrs-resolver@1.12.2'] !== true) throw new Error('unrs-resolver approval missing');
          if (policy.fsevents !== false) throw new Error('fsevents deny missing');
          if (fs.readFileSync('.node-version', 'utf8').trim() !== '24') throw new Error('.node-version mismatch');
          const npmrc = fs.readFileSync('.npmrc', 'utf8');
          if (!/^engine-strict=true$/m.test(npmrc)) throw new Error('engine-strict is not enabled');
          if (!/^strict-allow-scripts=true$/m.test(npmrc)) throw new Error('strict-allow-scripts is not enabled');
          NODE

      - name: Strict install
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci 2>&1 | tee /tmp/npm-ci.txt
          if grep -q 'install scripts not yet covered by allowScripts' /tmp/npm-ci.txt; then
            echo 'npm ci still reports unreviewed install scripts'
            exit 1
          fi

      - name: No pending install-script approvals
        run: |
          set -euo pipefail
          npm approve-scripts --allow-scripts-pending 2>&1 | tee /tmp/pending.txt
          if grep -Eq 'package(s)? ha(s|ve) install scripts not yet covered by allowScripts' /tmp/pending.txt; then
            cat /tmp/pending.txt
            exit 1
          fi

      - name: Audit and build
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run build

      - name: Negative test - unrs approval is required
        run: |
          set -euo pipefail
          rm -rf /tmp/dc08-unrs
          mkdir -p /tmp/dc08-unrs
          cp package.json package-lock.json .npmrc /tmp/dc08-unrs/
          cd /tmp/dc08-unrs
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.allowScripts = { fsevents: false };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          set +e
          npm ci > /tmp/dc08-unrs.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/dc08-unrs.log
          if [ "$STATUS" -eq 0 ]; then
            echo 'strict install unexpectedly succeeded without unrs approval'
            exit 1
          fi
          grep -q 'unrs-resolver@1.12.2' /tmp/dc08-unrs.log

      - name: Negative test - fsevents deny is required
        run: |
          set -euo pipefail
          rm -rf /tmp/dc08-fsevents
          mkdir -p /tmp/dc08-fsevents
          cp package.json package-lock.json .npmrc /tmp/dc08-fsevents/
          cd /tmp/dc08-fsevents
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.allowScripts = { 'unrs-resolver@1.12.2': true };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          set +e
          npm ci > /tmp/dc08-fsevents.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/dc08-fsevents.log
          if [ "$STATUS" -eq 0 ]; then
            echo 'strict install unexpectedly succeeded without fsevents deny'
            exit 1
          fi
          grep -q 'fsevents@2.3.3' /tmp/dc08-fsevents.log

      - name: Summarize result
        run: |
          echo 'DC-08 supply-chain gate PASS'
          echo "Node $(node --version)"
          echo "npm $(npm --version)"
