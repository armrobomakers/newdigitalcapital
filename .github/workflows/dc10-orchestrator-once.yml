name: DC-10 one-time GitHub orchestrator

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'stage/dc-10-live-temporal-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-10-live-temporal-ux
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Apply patch encoded in stage workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/dc-10-apply.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          raw_lines = workflow[start:end].splitlines()

          lines = []
          in_triple = False
          for raw in raw_lines:
              line = raw if in_triple else (raw[10:] if raw.startswith("          ") else raw)
              lines.append(line)
              if line.count("'''") % 2 == 1:
                  in_triple = not in_triple

          patch = "\n".join(lines)
          exec(compile(patch, 'dc10-patch', 'exec'))

          hook_path = Path('hooks/use-lead-capture-availability.ts')
          hook = hook_path.read_text(encoding='utf-8')
          old = '  useEffect(() => {\n    refresh();\n    const timer = window.setInterval(refresh, LEAD_WINDOW_REFRESH_MS);'
          new = '  useEffect(() => {\n    const timer = window.setInterval(refresh, LEAD_WINDOW_REFRESH_MS);'
          if hook.count(old) != 1:
              raise SystemExit(f'hook refresh cleanup mismatch: {hook.count(old)}')
          hook_path.write_text(hook.replace(old, new), encoding='utf-8')
          PY

      - name: Validate complete DC-10 batch
        run: |
          npm ci
          npm approve-scripts --allow-scripts-pending | tee /tmp/pending.txt
          grep -q 'No packages with unreviewed install scripts' /tmp/pending.txt
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          npm run check

      - name: Commit validated batch to stage branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hooks components .github/workflows/dc-10-apply.yml
          git commit -m "feat: make registration UX live with temporal state"
          git push origin HEAD:stage/dc-10-live-temporal-ux

      - name: Remove one-time orchestrator from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dc10-orchestrator-once.yml
          git commit -m "chore: remove DC-10 one-time orchestrator"
          git push origin HEAD:main
