name: DC-04 concise remediation

on:
  push:
    branches: [stage/dc-04-launch-infrastructure-security]
    paths: [.github/workflows/dc-04-remediate.yml]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-04-launch-infrastructure-security
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --save-exact next@16.3.2
      - run: npm install --save-dev --save-exact eslint-config-next@16.3.2 postcss@8.5.26
      - run: npm audit fix
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm run check
      - name: Record and push
        run: |
          mkdir -p docs
          printf '# DC-04 Security Remediation Result\n\n- next: `%s`\n- postcss: `%s`\n- production audit: **success**\n- full audit: **success**\n- lint/typecheck/build: **success**\n' "$(node -p "require('./node_modules/next/package.json').version")" "$(node -p "require('./node_modules/postcss/package.json').version")" > docs/DC-04-SECURITY-RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json docs/DC-04-SECURITY-RESULT.md
          git commit -m "security: remediate dependency advisories"
          git push origin HEAD:stage/dc-04-launch-infrastructure-security
