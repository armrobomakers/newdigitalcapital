name: Digital Capital final release gate

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/release-quality.yml]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:7485
      NEXT_PUBLIC_INDEXING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/archive-platform-2026-08-23
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Strict install and security audit
        run: |
          set -euo pipefail
          npm ci
          npm approve-scripts --allow-scripts-pending | tee /tmp/pending.txt
          grep -q 'No packages with unreviewed install scripts' /tmp/pending.txt
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Release source invariants
        run: |
          set -euo pipefail
          grep -q 'status: "past"' data/event-registry.ts
          grep -q 'attendee: false' data/event-registry.ts
          grep -q 'partner: false' data/event-registry.ts
          grep -q 'speaker: false' data/event-registry.ts
          grep -q 'media: false' data/event-registry.ts
          grep -q 'verified: false' data/events.ts
          grep -q 'price: ""' data/events.ts
          grep -q 'benefits: \[\]' data/events.ts
          grep -q 'Площадка архивного события сейчас не указана' data/events.ts
          ! grep -q '6 900 ₽' data/events.ts
          ! grep -q 'противоречили друг другу' data/events.ts
          ! grep -q 'Малышева 51' data/events.ts
          ! grep -q 'БЦ Саммит' data/events.ts
          ! grep -Rq 'href="#"' app components data --include='*.tsx' --include='*.ts'
          grep -q 'structuredDataReady: false' data/event-seo.ts
          grep -q 'strict-allow-scripts=true' .npmrc
          grep -q '"unrs-resolver@1.12.2": true' package.json
          grep -q '"fsevents": false' package.json

      - name: Code quality and production build
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: HTTP and security smoke
        run: |
          set -euo pipefail
          npm run start >/tmp/release-server.log 2>&1 &
          PID=$!
          trap 'STATUS=$?; if [ "$STATUS" -ne 0 ]; then echo "--- server log ---"; cat /tmp/release-server.log || true; fi; kill "$PID" 2>/dev/null || true' EXIT
          sleep 1
          node <<'NODE'
          const assert = require('node:assert/strict');
          const base = 'http://127.0.0.1:7485';

          async function sleep(ms) {
            await new Promise((resolve) => setTimeout(resolve, ms));
          }

          async function request(path, options = {}, expected) {
            let lastError;
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              try {
                const response = await fetch(base + path, options);
                if (expected === undefined || response.status === expected || (Array.isArray(expected) && expected.includes(response.status))) {
                  return response;
                }
                lastError = new Error(`${path}: unexpected status ${response.status}`);
              } catch (error) {
                lastError = error;
              }
              await sleep(500);
            }
            throw lastError ?? new Error(`${path}: request failed`);
          }

          (async () => {
            const healthResponse = await request('/api/health', {}, 200);
            const health = await healthResponse.json();
            assert.equal(health.status, 'gated');
            assert.equal(health.readiness.ready_for_registration, false);
            const registrationCodes = health.blockers.registration.map((item) => item.code);
            assert.ok(registrationCodes.includes('sales_event_missing'));
            assert.ok(registrationCodes.includes('legal_config_incomplete'));
            assert.ok(registrationCodes.includes('lead_storage_unavailable'));
            assert.equal(health.events[0].attendee_capture.reason, 'lead_type_disabled');

            const root = await request('/', { redirect: 'manual' }, [307, 308]);
            assert.match(root.headers.get('location') || '', /\/ekb$/);

            const ekbResponse = await request('/ekb', {}, 200);
            const ekb = await ekbResponse.text();
            assert.ok(ekb.includes('13 июня 2026'));
            assert.ok(ekb.includes('Архив'));
            assert.ok(!ekb.includes('6 900 ₽'));
            assert.ok(!ekb.includes('Малышева 51'));
            assert.ok(!ekb.includes('БЦ Саммит'));
            assert.ok(!ekb.includes('application/ld+json'));
            assert.ok(ekbResponse.headers.has('content-security-policy-report-only'));
            assert.equal(ekbResponse.headers.get('x-content-type-options'), 'nosniff');
            assert.equal(ekbResponse.headers.get('x-frame-options'), 'DENY');
            assert.equal(ekbResponse.headers.has('x-powered-by'), false);

            await request('/legal/privacy', {}, 200);
            await request('/legal/offer', {}, 200);
            await request('/thanks', {}, 200);
            await request('/apply/partner/ekb', {}, 200);
            await request('/not-a-conference', {}, 404);
            await request('/manifest.webmanifest', {}, 200);

            const robots = await (await request('/robots.txt', {}, 200)).text();
            assert.match(robots, /Disallow:\s*\//i);
            await request('/sitemap.xml', {}, 200);

            const analytics = await request('/api/analytics', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                event_name: 'page_view',
                event_id: 'ekb-2026-06-13',
                session_id: 'release-smoke-123456',
                path: '/ekb',
                properties: { source: 'release_smoke' },
              }),
            }, 202);
            const analyticsBody = await analytics.json();
            assert.equal(analyticsBody.accepted, true);

            const registration = await request('/api/register', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'idempotency-key': '123e4567-e89b-12d3-a456-426614174000',
              },
              body: JSON.stringify({
                event_id: 'ekb-2026-06-13',
                lead_type: 'attendee',
                name: 'Release Test',
                phone: '+79990000000',
                privacy_consent: true,
              }),
            }, 409);
            const registrationBody = await registration.json();
            assert.equal(registrationBody.error, 'registration_closed');
            assert.equal(registrationBody.reason, 'lead_type_disabled');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Summarize
        run: |
          echo 'FINAL RELEASE GATE PASS'
          echo "commit=$(git rev-parse HEAD)"
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
