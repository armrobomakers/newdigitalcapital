name: Apply DC-10 live temporal UX

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/dc-10-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-10-live-temporal-ux
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Apply DC-10 patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}: {old[:120]!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          Path('hooks').mkdir(exist_ok=True)
          Path('hooks/use-lead-capture-availability.ts').write_text('''"use client";

import { useCallback, useEffect, useState } from "react";

import {
  getLeadCaptureAvailability,
  type LeadCaptureAvailability,
  type LeadType,
} from "@/data/event-registry";

const LEAD_WINDOW_REFRESH_MS = 30_000;

export function useLeadCaptureAvailability(eventId: string, leadType: LeadType) {
  const [availability, setAvailability] = useState<LeadCaptureAvailability | null>(() =>
    getLeadCaptureAvailability(eventId, leadType)
  );

  const refresh = useCallback(() => {
    const nextAvailability = getLeadCaptureAvailability(eventId, leadType);
    setAvailability(nextAvailability);
    return nextAvailability;
  }, [eventId, leadType]);

  useEffect(() => {
    refresh();
    const timer = window.setInterval(refresh, LEAD_WINDOW_REFRESH_MS);

    const handleVisibilityChange = () => {
      if (document.visibilityState === "visible") {
        refresh();
      }
    };

    document.addEventListener("visibilitychange", handleVisibilityChange);

    return () => {
      window.clearInterval(timer);
      document.removeEventListener("visibilitychange", handleVisibilityChange);
    };
  }, [refresh]);

  return { availability, refresh };
}
''', encoding='utf-8')

          Path('components/temporal-registration-link.tsx').write_text('''"use client";

import Link from "next/link";

import { ArrowRightIcon } from "@/components/icons";
import { useLeadCaptureAvailability } from "@/hooks/use-lead-capture-availability";

type TemporalRegistrationLinkProps = {
  eventId: string;
  openLabel: string;
  closedLabel?: string;
  className?: string;
  withArrow?: boolean;
};

export function TemporalRegistrationLink({
  eventId,
  openLabel,
  closedLabel = "Смотреть программу",
  className,
  withArrow = false,
}: TemporalRegistrationLinkProps) {
  const { availability } = useLeadCaptureAvailability(eventId, "attendee");
  const open = availability?.open === true;

  return (
    <Link
      href={open ? "#register" : "#program"}
      className={className}
      data-registration-state={open ? "open" : "closed"}
    >
      <span>{open ? openLabel : closedLabel}</span>
      {withArrow ? <ArrowRightIcon className="h-5 w-5" /> : null}
    </Link>
  );
}
''', encoding='utf-8')

          Path('components/temporal-registration-gate.tsx').write_text('''"use client";

import type { ReactNode } from "react";

import { useLeadCaptureAvailability } from "@/hooks/use-lead-capture-availability";

export function TemporalRegistrationGate({
  eventId,
  openContent,
  closedContent,
}: {
  eventId: string;
  openContent: ReactNode;
  closedContent: ReactNode;
}) {
  const { availability } = useLeadCaptureAvailability(eventId, "attendee");

  return availability?.open === true ? openContent : closedContent;
}
