name: DC-08 supply-chain audit

on:
  push:
    branches: [stage/dc-08-supply-chain-reproducibility]
    paths: [.github/workflows/dc-08-audit.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-08-supply-chain-reproducibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Capture supply-chain inventory
        shell: bash
        run: |
          set -euo pipefail
          npm explain unrs-resolver > /tmp/explain.txt
          npm approve-scripts --allow-scripts-pending > /tmp/pending.txt || true
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const pkg = JSON.parse(fs.readFileSync('node_modules/unrs-resolver/package.json', 'utf8'));
          const script = fs.readFileSync('node_modules/unrs-resolver/postinstall.js');
          const hash = crypto.createHash('sha256').update(script).digest('hex');
          const lines = [];
          lines.push('# DC-08 Supply Chain Audit');
          lines.push('');
          lines.push(`- Tested commit: \`${process.env.GITHUB_SHA}\``);
          lines.push(`- Node: \`${process.version}\``);
          lines.push(`- npm: \`${process.env.npm_config_user_agent || 'unknown'}\``);
          lines.push(`- unrs-resolver version: \`${pkg.version}\``);
          lines.push(`- package postinstall: \`${pkg.scripts?.postinstall || ''}\``);
          lines.push(`- postinstall.js sha256: \`${hash}\``);
          lines.push(`- napi-postinstall dependency: \`${pkg.dependencies?.['napi-postinstall'] || ''}\``);
          lines.push('');
          lines.push('## Dependency path');
          lines.push('```text');
          lines.push(fs.readFileSync('/tmp/explain.txt', 'utf8').trim());
          lines.push('```');
          lines.push('');
          lines.push('## Pending install scripts');
          lines.push('```text');
          lines.push(fs.readFileSync('/tmp/pending.txt', 'utf8').trim() || '(none)');
          lines.push('```');
          fs.mkdirSync('docs', { recursive: true });
          fs.writeFileSync('docs/DC-08-SUPPLY-CHAIN-AUDIT.md', lines.join('\n') + '\n');
          NODE
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DC-08-SUPPLY-CHAIN-AUDIT.md
          git commit -m "security: record DC-08 supply-chain audit"
          git push origin HEAD:stage/dc-08-supply-chain-reproducibility
