name: DC-04 dependency audit

on:
  push:
    branches:
      - stage/dc-04-launch-infrastructure-security
    paths:
      - .github/workflows/dc-04-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/dc-04-launch-infrastructure-security
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Capture audits
        shell: bash
        run: |
          npm audit --json > /tmp/audit-all.json || true
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          npm outdated --json > /tmp/outdated.json || true
      - name: Write report
        shell: bash
        run: |
          mkdir -p docs
          node <<'NODE'
          const fs = require('fs');
          const all = JSON.parse(fs.readFileSync('/tmp/audit-all.json', 'utf8'));
          const prod = JSON.parse(fs.readFileSync('/tmp/audit-prod.json', 'utf8'));
          let outdated = {};
          try { outdated = JSON.parse(fs.readFileSync('/tmp/outdated.json', 'utf8')); } catch {}
          const rows = (audit) => Object.entries(audit.vulnerabilities || {}).map(([name, v]) => ({
            name,
            severity: v.severity,
            direct: Boolean(v.isDirect),
            via: (v.via || []).map(x => typeof x === 'string' ? x : `${x.name || name}:${x.title || 'advisory'}:${x.range || ''}`).join('; '),
            effects: (v.effects || []).join(', '),
            range: v.range || '',
            fix: v.fixAvailable === true ? 'available' : v.fixAvailable === false ? 'none' : JSON.stringify(v.fixAvailable),
          }));
          const metadata = (audit) => audit.metadata?.vulnerabilities || {};
          const lines = [];
          lines.push('# DC-04 Dependency Audit');
          lines.push('');
          lines.push(`- Tested commit: \`${process.env.GITHUB_SHA}\``);
          lines.push(`- Node: \`${process.version}\``);
          lines.push(`- Full audit counts: \`${JSON.stringify(metadata(all))}\``);
          lines.push(`- Production-only audit counts: \`${JSON.stringify(metadata(prod))}\``);
          lines.push('');
          lines.push('## Production dependency findings');
          const prodRows = rows(prod);
          if (!prodRows.length) lines.push('No production dependency vulnerabilities reported by npm audit.');
          for (const row of prodRows) {
            lines.push(`- **${row.name}** — ${row.severity}; direct=${row.direct}; range=\`${row.range}\`; fix=${row.fix}; via=${row.via}; effects=${row.effects}`);
          }
          lines.push('');
          lines.push('## Full dependency findings');
          const allRows = rows(all);
          if (!allRows.length) lines.push('No dependency vulnerabilities reported by npm audit.');
          for (const row of allRows) {
            lines.push(`- **${row.name}** — ${row.severity}; direct=${row.direct}; range=\`${row.range}\`; fix=${row.fix}; via=${row.via}; effects=${row.effects}`);
          }
          lines.push('');
          lines.push('## Direct package updates visible to npm outdated');
          for (const [name, info] of Object.entries(outdated)) {
            lines.push(`- **${name}** current=\`${info.current}\` wanted=\`${info.wanted}\` latest=\`${info.latest}\` location=\`${info.location || ''}\``);
          }
          fs.writeFileSync('docs/DC-04-DEPENDENCY-AUDIT.md', lines.join('\n') + '\n');
          NODE
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DC-04-DEPENDENCY-AUDIT.md
          git commit -m "security: record DC-04 dependency audit" || exit 0
          git push origin HEAD:stage/dc-04-launch-infrastructure-security
