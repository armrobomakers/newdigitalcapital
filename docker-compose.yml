services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:7485}
        NEXT_PUBLIC_INDEXING_ENABLED: ${NEXT_PUBLIC_INDEXING_ENABLED:-false}
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:7485}
      NEXT_PUBLIC_INDEXING_ENABLED: ${NEXT_PUBLIC_INDEXING_ENABLED:-false}
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "7485:7485"
